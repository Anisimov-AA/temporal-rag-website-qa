<h1>Experiments</h1>
<p class="sub">40 questions → 10 kept for the final check · 30 for tuning: 27 have a value to find, 3 don’t (“I don’t know” or a full list)</p>
<template id="terms-tpl"><details class="terms"><summary>what “broken keys” and “LLM judge” mean</summary>
<ul>
<li><b>Broken keys:</b> 3 of the 40 answer keys give 0 even to a correct answer. Each was checked against the site’s own pages and the scorer’s code.
<ul>
<li><b>dup-005</b> (all certificate rates): the key lists no words to find, so the scorer gives 0 to any answer.</li>
<li><b>dup-049</b> (any savings tier at 0.35% APY?): the key expects “No”, but the rate pages show 0.35% APY (Investor’s Choice, $25,000–$99,999.99).</li>
<li><b>dup-088</b> (Volunteer Time Off “last year”): the key expects 294, the 2023 count; the newest count on the site is 256 for 2024.</li>
</ul></li>
<li><b>Both ways:</b> every score is shown as the organizers count it; “without broken keys” only leaves these 3 questions out.</li>
<li><b>LLM judge:</b> Opus 5.5 reads the question, the reference answer and the page excerpts, and marks each answer right, partly or wrong by meaning (right 1, partly 0.5, wrong 0). The organizers’ scorer only looks for keywords, so a right answer in other words can get 0. The judge is a second look, the tables keep the scorer’s numbers.</li>
</ul></details></template>

function wins(text) {
  const [w, l] = text.match(/\d+/g).map(Number);
  if (!w && !l) return `<span class="diff">same</span>`;
  return [w ? `<span class="win">+${w}</span>` : "", l ? `<span class="loss">−${l}</span>` : ""].filter(Boolean).join(" ");
}

function pivot(step) {
  const split = r => r.what.split(" · ");
  const models = [...new Set(step.rows.map(r => split(r)[0]))];
  const variant = r => split(r).slice(1).join(" · ").replace(" (base)", "");
  const variants = [...new Set(step.rows.map(variant))].sort((a, b) => step.order.indexOf(a) - step.order.indexOf(b));
  const cell = (m, v) => step.rows.find(r => split(r)[0] === m && variant(r) === v);
  const cols = `<colgroup><col style="width:210px">${models.map(() => "<col>").join("")}</colgroup>`;
  const top = `<thead><tr><th>${step.label}</th>${models.map(m => `<th${m === step.ceiling ? ' class="ceil"' : ""}>${m}<div class="meta">${m === step.ceiling ? "ceiling · API" : (step.hw || HW[m] || "")}</div></th>`).join("")}</tr></thead>`;
  const head = t => step.tables ? `<div class="sec">${t}</div><table class="pivot fixed">${cols}${t === step.sections[0][0] ? top : ""}<tbody>` : `<table class="pivot">${top}<tbody>`;
  let html = step.tables ? "" : head(step.label);
  const sectionOf = v => step.sections ? step.sections.find(([, vs]) => vs.includes(v)) : null;
  let last = null;
  const td = (m, v, sec) => {
    const r = cell(m, v);
    if (!r) { return `<td class="plan" title="not run: not needed for this model">—</td>`; }
    if (!r.results) { return `<td class="plan" title="running or queued">…${r.before !== undefined ? `<div class="meta">step 5: ${r.before.toFixed(3)}</div>` : ""}</td>`; }
    const acc = ACC(r);
    const all = step.rows.filter(x => split(x)[0] === m && x.results && sectionOf(variant(x)) === sec).map(ACC);
    const b = r.vs && cell(m, r.vs) && cell(m, r.vs).results ? ACC(cell(m, r.vs)) : r.before !== undefined ? r.before :cell(m, step.base) && cell(m, step.base).results ? ACC(cell(m, step.base)) : null;
    const parts = [];
    parts.push(v !== step.base && typeof VS(r) === "string" && /\d/.test(VS(r)) ? wins(VS(r)) : "base");
    parts.push(typeof r.results[2] === "number" ? `${r.results[2]} s${(r.hw || "L4") !== HW[m] ? " " + (r.hw || "L4") : ""}` : "— s");
    const rep = `<div class="meta">repeat ${r.results[1] === null ? "—" : r.results[1].toFixed(2)}${r.words ? ` · ${r.words} words` : ""}</div>`;
    const noisy = r.meta !== undefined ? !!r.noisy : r.results[1] === null || r.results[1] < 0.7;
    if (step.compact) {
      const meta = r.meta || "";
      const short = /^search/.test(meta) ? meta : [meta.match(/[\d.]+ s/), meta.match(/rep [\d.—]+/)].filter(Boolean).map(x => x[0]).join(" · ");
      const extra = /^search/.test(meta) ? "" : [meta.match(/^(\+\d+ −\d+|same)/), meta.match(/[\d.]+\/2/), meta.match(/links \d\/7/)].filter(Boolean).map(x => x[0]).join(" · ");
      return `<td class="pick ${r.chosen ? "chosen" : ""}${m === step.ceiling && !step.transpose ? " ceil" : ""}" data-what="${r.what}" title="${meta}"><span class="acc">${r.chosen ? "✓ " : ""}${acc === null ? "—" : acc.toFixed(3)}</span>${(() => { const w = (meta.match(/^(\+\d+ −\d+|same)/) || [])[0]; const t = (meta.match(/[\d.]+ s/) || [])[0]; const rp = (meta.match(/rep [\d.]+/) || [])[0]; const line = [w, t, rp].filter(Boolean).join(" · "); return line ? `<div class="meta">${line}</div>` : ""; })()}</td>`;
    }
    return `<td class="pick ${noisy ? "noisy" : acc === Math.max(...all) ? "best" : ""}${r.chosen ? " chosen" : ""}" data-what="${r.what}"><span class="acc">${r.chosen ? "✓ " : ""}${acc.toFixed(3)}</span>${b !== null && v !== step.base ? ` <span class="diff">${acc - b >= 0 ? "+" : "−"}${Math.abs(acc - b).toFixed(3)}</span>` : ""}${r.meta !== undefined ? `<div class="meta">${r.meta}</div>` : v === step.base ? "" : `<div class="meta">${parts.join(" · ")}</div>${rep}`}</td>`;
  };
  const vlabel = v => (step.labels && step.labels[v] ? step.labels[v] : v.replace(" + ", "<br>+ ")) + (v === step.base && step.base !== "base" ? " <span class=\"tag\">base</span>" : "");
  if (step.parts) {
    return step.parts.map(pt => {
      const ms = models.filter(m => pt.order.some(v => cell(m, v)));
      const rows = ms.map(m => `<tr${m === step.ceiling ? ' class="ceiling"' : ""}><td><b>${m}</b><div class="meta">${m === step.ceiling ? "ceiling · API" : (step.hw || HW[m] || "")}</div></td>${pt.order.map(v => td(m, v, null)).join("")}</tr>`).join("");
      return `<div class="sec">${pt.title}</div><table class="pivot"><thead><tr><th>LLM</th>${pt.order.map(v => `<th>${pt.labels[v]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table><p class="choice">→ ${pt.choice}</p>`;
    }).join("");
  }
  if (step.transpose) {
    html = `<table class="pivot"><thead><tr><th>LLM</th>${variants.map(v => `<th>${step.labels && step.labels[v] ? step.labels[v] : v}</th>`).join("")}</tr></thead><tbody>`;
    const dropped = step.dropped || [];
    const line = m => { const top = m === step.ceiling; return `<tr class="${top ? "ceiling" : ""}${dropped.includes(m) ? " dropped" : ""}"><td><b>${m}</b><div class="meta">${top ? "ceiling · via agents, not the API" : (step.hw || HW[m] || "")}</div></td>${variants.map(v => td(m, v, null)).join("")}</tr>`; };
    models.filter(m => !dropped.includes(m)).forEach(m => { html += line(m); });
    if (dropped.length) {
      html += `<tr class="dropped-head" onclick="event.stopPropagation(); this.closest('table').classList.toggle('show-dropped')"><td colspan="${variants.length + 1}">▸ dropped (${dropped.length})${step.droppedWhy ? ` <span class="meta">· ${step.droppedWhy}</span>` : ""}</td></tr>`;
      dropped.forEach(m => { html += line(m); });
    }
    return html + "</tbody></table>";
  }
  variants.forEach(v => {
    const sec = sectionOf(v);
    if (sec && sec !== last && sec[0]) html += step.tables ? (last ? "</tbody></table>" : "") + head(sec[0]) : `<tr class="group"><td colspan="${models.length + 1}">${sec[0]}</td></tr>`;
    last = sec;
    html += `<tr><td>${vlabel(v)}</td>${models.map(m => td(m, v, sec)).join("")}</tr>`;
  });
  return html + "</tbody></table>";
}

function resultCells(step, row) {
  if (!row.results) return step.results.map(() => `<td class="plan">…</td>`).join("");
  return step.results.map(([, kind], i) => {
    const j = i > 3 && step.results.some(([, k]) => k === "words") ? i - 1 : i;
    const pick = r => MODE === 1 && r.cleanResults ? r.cleanResults[j] : i === 0 ? ACC(r) : kind === "text" ? VS(r) : r.results[j];
    const v = kind === "words" ? (row.words ?? null) : pick(row);
    if (v === null) return `<td class="plan">—</td>`;
    const all = step.rows.filter(r => r.results && typeof pick(r) === "number").map(pick);
    const best = kind === "low" || kind === "sec" ? Math.min(...all) : Math.max(...all);
    const cls = kind !== "n" && typeof v === "number" && v === best ? "best" : "";
    if (kind === "words") return `<td>${v}</td>`;
    if (kind === "3" || kind === "2") return `<td class="${cls}">${v.toFixed(Number(kind))}</td>`;
    if (kind === "bar") return `<td class="${cls}"><span class="bar" style="width:${Math.round(v * 60)}px"></span>${v.toFixed(2)}</td>`;
    const den = MODE === 1 && row.cleanResults && step.cleanDen ? step.cleanDen[i] || kind : kind;
    return `<td class="${cls}">${v}${kind.startsWith("/") ? den : ""}${kind === "sec" ? " s" : ""}</td>`;
  }).join("");
}

function buildBoard(el) {
  const xs = [];
  let x = 0;
  COLUMNS.forEach(c => { xs.push(x); x += c.width + GAP; });
  const options = COLUMNS.map(c => c.options);
  const rows = Math.max(...options.map(o => o.length));
  el.style.width = x - GAP + "px";
  el.style.height = TOP + rows * ROW + "px";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", x - GAP);
  svg.setAttribute("height", TOP + rows * ROW);
  const line = document.createElementNS(svgNS, "path");
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", "#1f2328");
  line.setAttribute("stroke-width", 1.5);
  svg.appendChild(line);
  el.appendChild(svg);
  PHASES.forEach(p => {
    const band = document.createElement("div");
    band.className = "phase";
    band.style.left = xs[p.from] + "px";
    band.style.width = xs[p.to] + COLUMNS[p.to].width - xs[p.from] + "px";
    band.innerHTML = `<b>${p.name}</b><span>${p.note}</span>`;
    el.appendChild(band);
  });
  const nodes = COLUMNS.map((c, i) => {
    const head = document.createElement("div");
    head.className = "head";
    head.style.top = TOP - 24 + "px";
    head.style.left = xs[i] + "px";
    head.innerHTML = LINK[c.key] ? `<a href="${LINK[c.key]}">${VERB[c.key]}</a>` : VERB[c.key];
    el.appendChild(head);
    return options[i].map(([main, small], r) => {
      const n = document.createElement("div");
      n.className = "node";
      n.style.left = xs[i] + "px";
      n.style.top = TOP + r * ROW + "px";
      n.style.width = c.width + "px";
      n.innerHTML = `<div class="main">${main}</div><div class="small">${small}</div>`;
      if (NODE_LINK[c.key]) { n.style.cursor = "pointer"; n.title = "open the page"; n.onclick = () => { location.href = LINK[c.key].split("#")[0] + "#" + NODE_LINK[c.key][r]; }; }
      else if (LINK[c.key]) { n.style.cursor = "pointer"; n.title = "open the page"; n.onclick = () => { location.href = LINK[c.key]; }; }
      el.appendChild(n);
      return n;
    });
  });
  return pick => {
    nodes.flat().forEach(n => n.classList.remove("on"));
    let d = "";
    pick.forEach((r, i) => {
      if (r === null) return;
      const rs = Array.isArray(r) ? [...r].sort((a, b) => a - b) : [r];
      const y = n => TOP + n * ROW + H / 2;
      const x0 = xs[i], x1 = xs[i] + COLUMNS[i].width;
      rs.forEach(n => nodes[i][n].classList.add("on"));
      d += (d ? " L" : "M") + x0 + " " + y(rs[0]) + " L" + x1 + " " + y(rs[0]);
      rs.slice(1).forEach((n, j) => { d += " M" + x0 + " " + y(rs[j]) + " L" + x0 + " " + y(n) + " L" + x1 + " " + y(n); });
    });
    line.setAttribute("d", d);
  };
}

function render() {

const open = [...root.querySelectorAll(".step > details")].map(d => d.open);

render.lastBlock = null;

  const card = document.createElement("div");
  card.className = "step";
  const head = `<tr><th>experiment</th>${step.results.map(([n]) => `<th>${n}</th>`).join("")}</tr>`;
  const acc = r => r.results ? ACC(r) : -1;
  let rows = step.sort ? [...step.rows].sort((a, b) => acc(b) - acc(a)) : step.rows;
  if (step.sortGroups) {
    const groupOf = r => r.what.split(" · ")[0];
    const order = [...new Set(step.rows.map(groupOf))];
    rows = [...step.rows].sort((a, b) => order.indexOf(groupOf(a)) - order.indexOf(groupOf(b)) || acc(b) - acc(a));
  }
  const line = r => `<tr class="${r.chosen ? "chosen" : ""}${r.dropped ? " dropped" : ""}"><td>${r.what}${r.group ? ` <span class="tag ${r.group}">${GROUPS[r.group]}</span>` : ""}${r.chosen ? ' <span class="mark">✓</span>' : ""}</td>${resultCells(step, r)}</tr>`;
  const after = rows.filter(r => r.after);
  rows = rows.filter(r => !r.after);
  const kept = rows.filter(r => !r.dropped), gone = rows.filter(r => r.dropped);
  const body = kept.map(line).join("") + (gone.length ? `<tr class="dropped-head" onclick="event.stopPropagation(); this.closest('table').classList.toggle('show-dropped')"><td colspan="${step.results.length + 1}">▸ dropped (${gone.length})${step.droppedWhy ? ` <span class="meta">· ${step.droppedWhy}</span>` : ""}</td></tr>` + gone.map(line).join("") : "");

  const isOpen = open.length ? open[k] : last;
  const blk = (label, html, cls = "") => `<div class="blk ${cls}"><div class="lbl">${label}</div><div>${html}</div></div>`;
  const lead = x => { const i = x.indexOf(": "); return i > 0 && i <= 45 && !x.slice(0, i).includes("<") ? `<b>${x.slice(0, i)}:</b>${x.slice(i + 1)}` : x; };

  card.innerHTML = `<details${isOpen ? " open" : ""}><summary><h2>${step.name}</h2>${step.answers ? ` <a class="ans-link" href="${step.answers === "step1" ? "answers/answers.html" : "answers/answers_" + step.answers + ".html"}" target="_blank">answers →</a>` : ""}${step.doc ? ` <a class="ans-link" href="${step.doc}">how it works →</a>` : ""}</summary>
${step.goal ? `<p class="goal">${step.goal}</p>` : `<div class="q">${step.question || ""}</div>`}
${(step.rows || []).some(r => (r.cleanResults && JSON.stringify(r.cleanResults) !== JSON.stringify(r.results)) || (r.clean && r.results && r.clean[0] !== r.results[0])) ? `<div class="tsw"><button data-m="0" class="sw${MODE === 0 ? " on" : ""}">all questions</button><button data-m="1" class="sw${MODE === 1 ? " on" : ""}">without the 3 broken keys</button></div>` : ""}${last ? document.getElementById("terms-tpl").innerHTML : ""}
${step.pivot ? pivot(step) : `<table class="detail"><thead>${head}</thead><tbody>${body}</tbody></table>`}
${after.length ? `<div class="aftertitle">${step.afterTitle || "after the fix"}</div><table class="detail after"><thead>${head}</thead><tbody>${after.map(line).join("")}</tbody></table>` : ""}
${step.extra ? `<details class="side"><summary>side check · ${step.extra.title}</summary><table class="detail side"><thead><tr>${step.extra.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${step.extra.rows.map(r => `<tr class="${r.chosen ? "chosen" : ""}">${r.cells.map((c, i) => `<td>${c}${i === 0 && r.chosen ? ' <span class="mark">✓</span>' : ""}</td>`).join("")}</tr>`).join("")}</tbody></table></details>` : ""}
${step.result ? `<div class="result">${list(step.result)}</div>` : step.findings ? `<div class="findings">${step.findings}</div>` : ""}
${step.decision ? `<p class="choice">→ ${step.decision.replace(/^→\s*/, "")}</p>` : ""}
${step.read ? `<details class="read"><summary>how to read</summary>${list(step.read.map(([t, m]) => `<b>${t}</b> — ${m}`))}</details>` : ""}
${step.notes ? `<div class="notes">${step.notes}</div>` : ""}</details>`;
  if (step.block && step.block !== render.lastBlock) { const bh = document.createElement("div"); bh.className = "blockhead"; bh.textContent = step.block; root.appendChild(bh); }
  render.lastBlock = step.block;
  root.appendChild(card);
  const plain = h => h.replace(/<div class=meta>/g, " ").replace(/<[^>]*>/g, "").trim();
  if (step.pivot) rows.forEach(row => { const [m, ...v] = row.what.split(" · "); const k = v.join(" · "); allRows.push({tr: null, row, label: m + " · " + plain(step.labels && step.labels[k] ? step.labels[k] : k)}); });
  else {
    const shown = rows.filter(r => !r.dropped).concat(rows.filter(r => r.dropped)).concat(after);
    [...card.querySelectorAll("table.detail:not(.side) tbody tr:not(.dropped-head)")].forEach((tr, k) => allRows.push({tr, row: shown[k]}));
  }
});
allRows.forEach((a, n) => { if (a.tr) a.tr.onclick = () => select(n); });
document.querySelectorAll(".pivot td.pick").forEach(td => td.onclick = () => {
  const n = allRows.findIndex(a => a.row && a.row.what === td.dataset.what);
  if (n >= 0) { select(n); document.querySelectorAll(".pivot td.pick").forEach(x => x.classList.toggle("open", x === td)); }
});
}
function select(n) {
  if (!allRows[n]) return;
  allRows.forEach((a, j) => a.tr && a.tr.classList.toggle("open", j === n));
  show(allRows[n].row.pick);
  document.getElementById("picked").textContent = allRows[n].label || allRows[n].row.what.replace(/<[^>]*>/g, "");
}
document.addEventListener("click", e => {
  const a = e.target.closest(".tsw .sw");
  if (!a) return;
  e.preventDefault();
  const card = a.closest(".step");
  const k = [...document.querySelectorAll(".step")].indexOf(card);
  const before = card.getBoundingClientRect().top;
  MODE = +a.dataset.m; render(); select(allRows.findLastIndex(x => x.row.chosen)); fit();
  const now = document.querySelectorAll(".step")[k];
  if (now) window.scrollBy(0, now.getBoundingClientRect().top - before);
});
render();
select(allRows.findLastIndex(a => a.row.chosen));
function fit() {
  const board = document.getElementById("board"), box = document.getElementById("fit");
  const scale = Math.min(1, box.clientWidth / board.offsetWidth);
  board.style.transform = `scale(${scale})`;
  box.style.height = board.offsetHeight * scale + "px";
}
window.addEventListener("resize", fit);
fit();
</script>
</body>
</html>
