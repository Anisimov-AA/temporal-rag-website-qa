o\">3</span><span class=\"rtx\"><span class=\"cname2\">Rates</span> <span class=\"cfrom\">— dupaco.com/rates</span></span></div><div class=\"rrow right\"><span class=\"rno\">4</span><span class=\"rtx\"><span class=\"cname2\">Get on the road with low interest rates</span> <span class=\"cfrom\">— dupaco.com/personal/loans/auto-loans/</span></span></div><div class=\"rrow right\"><span class=\"rno\">5</span><span class=\"rtx\"><span class=\"cname2\">Get on the road with low interest rates</span> <span class=\"cfrom\">— dupaco.com/personal/loans/auto-motorcycle-loans</span></span></div><div class=\"bl gap\">✂ the first 5 go to the LLM · places 6–30 are dropped</div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">6</span><span class=\"rtx\"><span class=\"cname2\">As vehicle costs rise, steer clear of costly mistakes | Dupa</span> <span class=\"cfrom\">— dupaco.com/learn/blog/as-vehicle-costs-continue-to-rise-dupaco-helps-buyers-steer-clear-of-costly-mistakes</span></span></div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">7</span><span class=\"rtx\"><span class=\"cname2\">Loan Rates</span> <span class=\"cfrom\">— dupaco.com/switch-and-earn</span></span></div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">8</span><span class=\"rtx\"><span class=\"cname2\">Boat &amp; RV Loan Rates</span> <span class=\"cfrom\">— dupaco.com/personal/loans/recreational-loans</span></span></div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">9</span><span class=\"rtx\"><span class=\"cname2\">Rates</span> <span class=\"cfrom\">— dupaco.com/rates</span></span></div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">10</span><span class=\"rtx\"><span class=\"cname2\">Rates</span> <span class=\"cfrom\">— dupaco.com/rates</span></span></div></div></div><div class=\"swp\" data-i=\"1\" hidden><div class=\"what\"><b>What are the drive-up hours?</b></div><div class=\"lbl\">reranked list</div><div class=\"blk\"><div class=\"where-ans\">answer (green) at places <b>1, 2, 3, 4, 5</b> of 5</div><div class=\"rrow right\"><span class=\"rno\">1</span><span class=\"rtx\"><span class=\"cname2\">Dupaco Credit Union celebrates completion of newest learning</span> <span class=\"cfrom\">— dupaco.com/newsroom/dupaco-community-credit-union-celebrates-completion-of-newest-learning-lab-3</span></span></div><div class=\"rrow right\"><span class=\"rno\">2</span><span class=\"rtx\"><span class=\"cname2\">Dupaco Community Credit Union celebrates completion of expan</span> <span class=\"cfrom\">— dupaco.com/newsroom/dupaco-community-credit-union-celebrates-completion-of-expanded-branch</span></span></div><div class=\"rrow right\"><span class=\"rno\">3</span><span class=\"rtx\"><span class=\"cname2\">Dupaco celebrates completion of newest learning lab</span> <span class=\"cfrom\">— dupaco.com/newsroom/dupaco-celebrates-completion-of-newest-learning-lab</span></span></div><div class=\"rrow right\"><span class=\"rno\">4</span><span class=\"rtx\"><span class=\"cname2\">Dupaco Credit Union celebrates completion of newest learning</span> <span class=\"cfrom\">— dupaco.com/newsroom/dupaco-community-credit-union-celebrates-completion-of-newest-learning-lab-2</span></span></div><div class=\"rrow right\"><span class=\"rno\">5</span><span class=\"rtx\"><span class=\"cname2\">Dupaco Credit Union celebrates completion of newest learning</span> <span class=\"cfrom\">— dupaco.com/newsroom/dupaco-community-credit-union-celebrates-completion-of-newest-learning-lab</span></span></div><div class=\"bl gap\">✂ the first 5 go to the LLM · places 6–40 are dropped</div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">6</span><span class=\"rtx\"><span class=\"cname2\">Providing more than financial support in a jumbled world</span> <span class=\"cfrom\">— dupaco.com/business/resources/providing-more-than-financial-support-in-a-jumbled-world</span></span></div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">7</span><span class=\"rtx\"><span class=\"cname2\">Why members use live video tellers</span> <span class=\"cfrom\">— dupaco.com/learn/blog/make-live-remote-transactions</span></span></div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">8</span><span class=\"rtx\"><span class=\"cname2\">https://www.dupaco.com/hubfs/5626_layout_LO.pdf</span> <span class=\"cfrom\">— dupaco.com/hubfs/5626_layout_LO.pdf</span></span></div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">9</span><span class=\"rtx\"><span class=\"cname2\">Perks You’ll Love</span> <span class=\"cfrom\">— dupaco.com/careers</span></span></div><div class=\"rrow\" style=\"opacity:.45\"><span class=\"rno\">10</span><span class=\"rtx\"><span class=\"cname2\">We’re Here to Help</span> <span class=\"cfrom\">— dupaco.com/contact</span></span></div></div></div></div>"}]}];
const open = new Set();
let fresh = null;
function draw(nodes, box, depth) {
  nodes.forEach((n, i) => {
    const sum = n.id.endsWith(".sum");  // a summary, not a step: no number, no arrow into it
    if (i) box.insertAdjacentHTML("beforeend", sum ? '<span class="gapline"></span>' : '<span class="arrow"></span>');
    const item = document.createElement("div"); item.className = "item";
    const b = document.createElement("button"); b.className = "step" + (open.has(n.id) ? " open" : "");
    b.dataset.depth = depth;
    if (sum) b.classList.add("summary");
    b.innerHTML = (sum ? "" : '<span class="num">' + n.id + "</span>") + n.name + (n.kids || n.card ? '<span class="plus">' + (open.has(n.id) ? "−" : "+") + "</span>" : "");
    if (n.kids || n.card) b.onclick = () => { if (open.has(n.id)) open.delete(n.id); else { open.add(n.id); fresh = n.id; } render(); };
    item.appendChild(b);
    if (n.card && open.has(n.id)) {
      item.classList.add("down");
      item.insertAdjacentHTML("beforeend", '<div class="card' + (fresh === n.id ? " new" : "") + '">' + n.card + "</div>");
    }
    if (n.kids && open.has(n.id)) {
      const c = document.createElement("div"); c.className = "col kids" + (fresh === n.id ? " new" : "");
      item.classList.add("down");
      item.appendChild(c); draw(n.kids, c, depth + 1);
    }
    box.appendChild(item);
  });
}
function align() {
  const by = {};
  document.querySelectorAll(".step").forEach(b => { b.style.minWidth = ""; (by[b.dataset.depth] ||= []).push(b); });
  Object.values(by).forEach(bs => { const w = Math.max(...bs.map(b => b.offsetWidth)); bs.forEach(b => b.style.minWidth = w + "px"); });
}
const HEAD = {h: "#818b98", r: "#bf8700", s: "#59636e"};
function arrows() {
  document.querySelectorAll(".dia").forEach(dia => {
    dia.querySelector(":scope > svg.arr")?.remove();
    const kids = [...dia.querySelectorAll(":scope > .at")];
    dia.style.height = Math.max(...kids.map(k => k.offsetTop + k.offsetHeight)) + "px";
    const base = dia.getBoundingClientRect();
    const box = id => { const r = document.getElementById(id).getBoundingClientRect();
      return {l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top}; };
    const paths = JSON.parse(dia.dataset.arrows).map(([a, b, cls]) => {
      const s = box(a), e = box(b);
      let d;
      if (e.l > s.r - 10) {
        const x1 = s.r, y1 = (s.t + s.b) / 2, x2 = e.l - 3, y2 = Math.min(Math.max(y1, e.t + 14), e.b - 14), c = Math.max(30, (x2 - x1) / 2);
        d = `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
      } else {
        const x1 = (s.l + s.r) / 2, y1 = s.b, x2 = (e.l + e.r) / 2, y2 = e.t - 3, c = Math.max(20, (y2 - y1) / 2);
        d = `M${x1},${y1} C${x1},${y1 + c} ${x2},${y2 - c} ${x2},${y2}`;
      }
      return `<path class="${cls}" d="${d}" marker-end="url(#ah-${cls})"/>`;
    }).join("");
    const marks = Object.entries(HEAD).map(([k, c]) => `<marker id="ah-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${c}"/></marker>`).join("");
    dia.insertAdjacentHTML("afterbegin", `<svg class="arr" width="${dia.scrollWidth}" height="${dia.scrollHeight}"><defs>${marks}</defs>${paths}</svg>`);
  });
}
function render() { const p = document.getElementById("pipe"); const kids = STEPS[0].kids; if (kids.length === 1) { p.innerHTML = `<div class="card">${kids[0].card}</div>`; } else { p.innerHTML = ""; draw(kids, p, 1); } align(); arrows(); fresh = null; }
addEventListener("resize", arrows);
addEventListener("animationend", arrows);
document.addEventListener("click", e => {  // a switch inside a card: show one pane, keep the open steps as they are
  const b = e.target.closest(".sw");
  if (!b) return;
  const box = b.closest(".switch");
  box.querySelectorAll(":scope > .swb > .sw").forEach(x => x.classList.toggle("on", x === b));
  box.querySelectorAll(":scope > .swp").forEach(p => p.hidden = p.dataset.i !== b.dataset.i);
});
render();
</script></body></html>
