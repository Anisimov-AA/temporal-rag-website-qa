</style><style>.back{font-size:12px;margin:0 0 6px}.back a{color:var(--muted)}h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin:0 0 16px}</style></head><body><p class="back"><a href="../config.html">← config</a></p><h1>6.4 Ask the LLM</h1><p class="sub">Gemma 4 26B reads the prompt and writes the answer in JSON</p><div class="col" id="pipe"></div><script>const STEPS = [{"id": "6", "name": "ask the llm", "kids": [{"id": "6.4", "name": "ask the LLM", "card": "<div class=\"cpart\"><div class=\"what\">The prompt goes to Gemma 4 26B A4B in Ollama, on the same L4 as the reranker. It answers in JSON; the code reads <code>answer</code> and <code>known</code> from it, after removing a stray backslash that would break the JSON. If there is no JSON at all, the whole text becomes the answer.</div><div class=\"what\">Settings: temperature 0 and seed 42 (the same answer every time), a window of 8,192 tokens, at most 1,024 tokens in the answer, thinking off.</div><div class=\"ename\"><span class=\"where\">solution/generation/ask_the_llm.py · LLMS[\"gcp:gemma4:26b\"], ask_the_llm(), parse_reply(), Reply</span></div></div><div class=\"ba\"><div><div class=\"lbl\">what Gemma sends back for dup-016</div><div class=\"blk\"><div class=\"bl\">```json</div><div class=\"bl\">{\"answer\": \"For a 2024-27 model year vehicle, the APR for a 60-month auto loan is as low as 5.39% (effective as of 08/31/2026).\", \"known\": true}</div><div class=\"bl\">```</div></div></div><div><div class=\"lbl\">what the code reads from it</div><div class=\"blk\"><div class=\"bl\"><b>answer</b> = For a 2024-27 model year vehicle, the APR for a 60-month auto loan is as low as 5.39% (effective as of 08/31/2026).</div><div class=\"bl\"><b>known</b> = true · the answer is kept</div><div class=\"bl\"><b>pages</b> = [ ] · only the demo asks for them</div></div></div></div><div class=\"cpart\"><div class=\"what\">The words in a model name, and why they matter here:</div></div><table class=\"grid\"><tr><th>word</th><th>what it means</th><th>why it matters here</th></tr><tr><td>26B</td><td>26 billion weights in total</td><td>all of them sit in GPU memory</td></tr><tr><td>A4B</td><td>only about 4 billion work on each word (mixture of experts)</td><td>it runs almost as fast as a 4B model: speed is 15% of the score</td></tr><tr><td>dense</td><td>every weight works on every word (Gemma 31B, Qwen 27B and 32B)</td><td>smarter per word, but several times slower</td></tr><tr><td>q4 · q8</td><td>4 or 8 bits per weight</td><td>q4: 26B fits in 17 GB instead of about 52, next to the reranker on one 24 GB L4</td></tr><tr><td>QAT</td><td>trained knowing it will be squeezed to 4 bits</td><td>loses less in q4</td></tr><tr><td>context window</td><td>how much text it reads at once: 8,192 tokens</td><td>the 5 chunks and the question are about 5–6 thousand tokens</td></tr><tr><td>thinking</td><td>the model reasons before it answers</td><td>here: 0.739 → 0.436 and 3 s → 14 s (step 6), so it is off</td></tr><tr><td>temperature 0, seed 42</td><td>no randomness</td><td>the same answer on a repeat: 40 of 40</td></tr></table><div class=\"cpart\"><div class=\"what\">Why Gemma 4 26B A4B q4 (step 4): every model read the same 5 chunks for the 30 tuning questions, in 5 reply formats; below is each model’s best format. Bigger models score a little higher only on an A100 and 3× slower; the API models are fast but give different answers on a repeat and cannot run in the submission.</div></div><table class=\"grid\"><tr><th>model</th><th>GPU</th><th>its best format</th><th>accuracy</th><th>seconds</th><th></th></tr><tr><td><b>Gemma 4 26B A4B q4</b></td><td>L4</td><td>JSON + known line</td><td><b>0.739</b></td><td>3.3</td><td><b>in use</b>: the best that runs fast on one L4</td></tr><tr><td>Gemma 4 31B QAT q4</td><td>T4</td><td>JSON + known line</td><td>0.708</td><td>21.5</td><td>lower and much slower</td></tr><tr><td>Qwen3.6 27B q4</td><td>L4</td><td>JSON + known line</td><td>0.657</td><td>11.6</td><td>lower, 3× slower</td></tr><tr><td>Qwen3 32B q4</td><td>L4</td><td>JSON + known line</td><td>0.640</td><td>11.4</td><td>lower, 3× slower</td></tr><tr><td>Gemma 4 31B q8</td><td>A100</td><td>text + known line</td><td>0.780</td><td>10.4</td><td>better, but needs 33 GB and 3× the time</td></tr><tr><td>Qwen3.6 27B q8</td><td>A100</td><td>text + known line</td><td>0.774</td><td>11.0</td><td>the same story</td></tr><tr><td>Gemma 4 26B q8</td><td>A100</td><td>JSON + known line</td><td>0.739</td><td>12.3</td><td>no gain over q4</td></tr><tr><td>Nemotron 3.5 Bolt E4B</td><td>API</td><td>text + known line</td><td>0.730</td><td>1.1</td><td>fast, but a repeat gives the same answer only 70% of the time</td></tr><tr><td>Gemini 3.5 Flash-Lite</td><td>API</td><td>text</td><td>0.716</td><td>2.7</td><td>a repeat agrees only 60% of the time</td></tr><tr><td>Claude Opus 5.5</td><td>API</td><td>JSON</td><td>0.820</td><td>—</td><td>the ceiling: a much stronger model on the same chunks, not allowed in the submission</td></tr></table>"}]}];
const open = new Set();
let fresh = null;
function draw(nodes, box, depth) {
  nodes.forEach((n, i) => {
    const sum = n.id.endsWith(".sum");  // a summary, not a step: no number, no arrow into it
    if (i) box.insertAdjacentHTML("beforeend", sum ? '<span class="gapline"></span>' : '<span class="arrow"></span>');
    const item = document.createElement("div"); item.className = "item";
    const b = document.createElement("button"); b.className = "step" + (open.has(n.id) ? " open" : "");
    b.dataset.depth = depth;
    if (sum) b.classList.add("summary");
    b.innerHTML = (sum ? "" : '<span class="num">' + n.id + "</span>") + n.name + (n.kids || n.card ? '<span class="plus">' + (open.has(n.id) ? "−" : "+") + "</span>" : "");
    if (n.kids || n.card) b.onclick = () => { if (open.has(n.id)) open.delete(n.id); else { open.add(n.id); fresh = n.id; } render(); };
    item.appendChild(b);
    if (n.card && open.has(n.id)) {
      item.classList.add("down");
      item.insertAdjacentHTML("beforeend", '<div class="card' + (fresh === n.id ? " new" : "") + '">' + n.card + "</div>");
    }
    if (n.kids && open.has(n.id)) {
      const c = document.createElement("div"); c.className = "col kids" + (fresh === n.id ? " new" : "");
      item.classList.add("down");
      item.appendChild(c); draw(n.kids, c, depth + 1);
    }
    box.appendChild(item);
  });
}
function align() {
  const by = {};
  document.querySelectorAll(".step").forEach(b => { b.style.minWidth = ""; (by[b.dataset.depth] ||= []).push(b); });
  Object.values(by).forEach(bs => { const w = Math.max(...bs.map(b => b.offsetWidth)); bs.forEach(b => b.style.minWidth = w + "px"); });
}
const HEAD = {h: "#818b98", r: "#bf8700", s: "#59636e"};
function arrows() {
  document.querySelectorAll(".dia").forEach(dia => {
    dia.querySelector(":scope > svg.arr")?.remove();
    const kids = [...dia.querySelectorAll(":scope > .at")];
    dia.style.height = Math.max(...kids.map(k => k.offsetTop + k.offsetHeight)) + "px";
    const base = dia.getBoundingClientRect();
    const box = id => { const r = document.getElementById(id).getBoundingClientRect();
      return {l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top}; };
    const paths = JSON.parse(dia.dataset.arrows).map(([a, b, cls]) => {
      const s = box(a), e = box(b);
      let d;
      if (e.l > s.r - 10) {
        const x1 = s.r, y1 = (s.t + s.b) / 2, x2 = e.l - 3, y2 = Math.min(Math.max(y1, e.t + 14), e.b - 14), c = Math.max(30, (x2 - x1) / 2);
        d = `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
      } else {
        const x1 = (s.l + s.r) / 2, y1 = s.b, x2 = (e.l + e.r) / 2, y2 = e.t - 3, c = Math.max(20, (y2 - y1) / 2);
        d = `M${x1},${y1} C${x1},${y1 + c} ${x2},${y2 - c} ${x2},${y2}`;
      }
      return `<path class="${cls}" d="${d}" marker-end="url(#ah-${cls})"/>`;
    }).join("");
    const marks = Object.entries(HEAD).map(([k, c]) => `<marker id="ah-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${c}"/></marker>`).join("");
    dia.insertAdjacentHTML("afterbegin", `<svg class="arr" width="${dia.scrollWidth}" height="${dia.scrollHeight}"><defs>${marks}</defs>${paths}</svg>`);
  });
}
function render() { const p = document.getElementById("pipe"); const kids = STEPS[0].kids; if (kids.length === 1) { p.innerHTML = `<div class="card">${kids[0].card}</div>`; } else { p.innerHTML = ""; draw(kids, p, 1); } align(); arrows(); fresh = null; }
addEventListener("resize", arrows);
addEventListener("animationend", arrows);
document.addEventListener("click", e => {  // a switch inside a card: show one pane, keep the open steps as they are
  const b = e.target.closest(".sw");
  if (!b) return;
  const box = b.closest(".switch");
  box.querySelectorAll(":scope > .swb > .sw").forEach(x => x.classList.toggle("on", x === b));
  box.querySelectorAll(":scope > .swp").forEach(p => p.hidden = p.dataset.i !== b.dataset.i);
});
render();
</script></body></html>
