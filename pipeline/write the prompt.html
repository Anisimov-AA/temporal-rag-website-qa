-i=\"0\" hidden><div class=\"what\">no rule for “I don&#x27;t know”, a plain answer</div><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date, then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div></div></div><div class=\"swp\" data-i=\"1\" hidden><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\"><ins><span class=\"ptag\">known line</span> If the excerpts do not answer the question, reply exactly: I don&#x27;t know.</ins></div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date, then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div></div></div><div class=\"swp\" data-i=\"2\" hidden><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date, then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div><div class=\"bl\"><ins><span class=\"ptag\">reply format</span> Reply as JSON: {&quot;answer&quot;: …, &quot;known&quot;: true/false}</ins></div></div></div><div class=\"swp\" data-i=\"3\"><div class=\"what\">in use</div><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\"><ins><span class=\"ptag\">known line</span> If the excerpts do not answer the question, set &quot;known&quot; to false.</ins></div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date, then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div><div class=\"bl\"><ins><span class=\"ptag\">reply format</span> Reply as JSON: {&quot;answer&quot;: …, &quot;known&quot;: true/false}</ins></div></div></div><div class=\"swp\" data-i=\"4\" hidden><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date, then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div><div class=\"bl\"><ins><span class=\"ptag\">reply format</span> Reply as JSON: {&quot;analysis&quot;: …, &quot;answer&quot;: …, &quot;known&quot;: true/false}</ins></div></div></div><div class=\"swp\" data-i=\"5\" hidden><div class=\"what\">the demo, for its links</div><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\"><span class=\"ptag\">known line</span> If the excerpts do not answer the question, set &quot;known&quot; to false.</div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date, then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div><div class=\"bl\"><ins><span class=\"ptag\">reply format</span> Reply as JSON: {&quot;answer&quot;: …, &quot;known&quot;: true/false, &quot;pages&quot;: [numbers of the excerpts you used]}</ins></div></div></div><div class=\"swp\" data-i=\"6\" hidden><div class=\"what\">step 10, not used</div><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\"><ins><span class=\"ptag\">rule</span> Give the newest fact for the date of the question. Do not list older values unless the member asks about the past.</ins></div><div class=\"bl\"><span class=\"ptag\">known line</span> If the excerpts do not answer the question, set &quot;known&quot; to false.</div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date, then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div><div class=\"bl\"><span class=\"ptag\">reply format</span> Reply as JSON: {&quot;answer&quot;: …, &quot;known&quot;: true/false}</div></div></div><div class=\"swp\" data-i=\"7\" hidden><div class=\"what\">step 10, not used · the demo uses it</div><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\"><ins><span class=\"ptag\">date</span> Today is ⟨the site version&#x27;s date⟩.</ins></div><div class=\"bl\"><span class=\"ptag\">known line</span> If the excerpts do not answer the question, set &quot;known&quot; to false.</div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date, then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div><div class=\"bl\"><span class=\"ptag\">reply format</span> Reply as JSON: {&quot;answer&quot;: …, &quot;known&quot;: true/false}</div></div></div><div class=\"swp\" data-i=\"8\" hidden><div class=\"what\">step 10, not used</div><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\"><span class=\"ptag\">known line</span> If the excerpts do not answer the question, set &quot;known&quot; to false.</div><div class=\"bl\">Website excerpts:</div><div class=\"bl\">⟨5 excerpts: [n] address · date,</div><div class=\"bl\"><ins>This page: ⟨address⟩</ins></div><div class=\"bl\">then the chunk text⟩</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: ⟨the question⟩</div><div class=\"bl\"><span class=\"ptag\">reply format</span> Reply as JSON: {&quot;answer&quot;: …, &quot;known&quot;: true/false}</div></div></div></div><div class=\"lbl\" style=\"margin-top:10px\">the real prompt for dup-016 (each chunk: its title, then its 60-month row and its date)</div><div class=\"blk\"><div class=\"bl\"><span class=\"ptag\">role</span> You are the member assistant of Dupaco Community Credit Union.</div><div class=\"bl\"><span class=\"ptag\">role</span> You answer only from the website excerpts you are given.</div><div class=\"bl\"><ins><span class=\"ptag\">known line</span> If the excerpts do not answer the question, set &quot;known&quot; to false.</ins></div><div class=\"bl\">Website excerpts:</div><div class=\"bl\"><b>[1] https://www.dupaco.com/rates · 2026-09-28</b></div><div class=\"bl\">Deposit and Loan Rates: Earn More, Pay Less | Dupaco</div><div class=\"bl\">Rates</div><div class=\"bl gap\">…</div><div class=\"bl\">| 2024-27 Model Year | 60 Months | 5.39% APR1 |</div><div class=\"bl\">Rates are effective as of 08/31/2026.</div><div class=\"bl gap\">… 17 more lines of this chunk …</div><div class=\"bl\"><b>[2] https://www.dupaco.com/personal/loans/auto-loans/ · 2026-09-28</b></div><div class=\"bl\">Auto &amp; Motorcycle Loans and Sales | Dupaco</div><div class=\"bl\">Auto Loans For Every Ride › Get on the road with low interest rates</div><div class=\"bl gap\">…</div><div class=\"bl\">| 2024-27 Model Year | 60 Months | 5.39% APR1 |</div><div class=\"bl\">Rates are effective as of 08/31/2026.</div><div class=\"bl gap\">… 19 more lines of this chunk …</div><div class=\"bl\"><b>[3] https://www.dupaco.com/personal/loans/auto-motorcycle-loans · 2026-09-28</b></div><div class=\"bl\">Auto &amp; Motorcycle Loans and Sales | Dupaco</div><div class=\"bl\">Auto Loans For Every Ride › Get on the road with low interest rates</div><div class=\"bl gap\">…</div><div class=\"bl\">| 2024-27 Model Year | 60 Months | 5.39% APR1 |</div><div class=\"bl\">Rates are effective as of 08/31/2026.</div><div class=\"bl gap\">… 19 more lines of this chunk …</div><div class=\"bl\"><b>[4] https://www.dupaco.com/switch-and-earn · 2026-09-28</b></div><div class=\"bl\">Refinance Your Loan &amp; Earn Cash Back | Dupaco</div><div class=\"bl\">Refinance Your Loan &amp; Earn up to $300* Cash Back › Loan Rates</div><div class=\"bl gap\">…</div><div class=\"bl\">| 2023–26 Model Year | 60 Months | 5.34% APR |</div><div class=\"bl\">Rates are effective as of 1/1/2026.</div><div class=\"bl gap\">… 15 more lines of this chunk …</div><div class=\"bl\"><b>[5] https://www.dupaco.com/calculators/vehicle-affordability · 2026-09-28</b></div><div class=\"bl\">Vehicle Affordability Calculator | Dupaco</div><div class=\"bl\">Vehicle Affordability Calculator › Get on the road with low interest rates</div><div class=\"bl gap\">…</div><div class=\"bl\">| 2023–26 Model Year | 60 Months | 5.34% APR |</div><div class=\"bl\">Rates are effective as of 1/1/2026.</div><div class=\"bl gap\">… 19 more lines of this chunk …</div><div class=\"bl\"><span class=\"ptag\">question</span> Member question: What&#x27;s the APR for a 60-month auto loan on a 2025 model-year vehicle?</div><div class=\"bl\"><span class=\"ptag\">reply format</span> Reply as JSON: {&quot;answer&quot;: …, &quot;known&quot;: true/false}</div></div><div class=\"lbl\" style=\"margin-top:8px\">Gemma’s answer</div><div class=\"blk\"><div class=\"bl\"><ins>For a 2024-27 model year vehicle, the APR for a 60-month auto loan is as low as 5.39% (effective as of 08/31/2026).</ins></div></div><div class=\"cpart\"><div class=\"what\">Why JSON + known line: 5 reply formats were tried on the 30 tuning questions (step 4). Gemma does best with JSON and the known line; Opus does best with plain JSON. Extra rules in the prompt (the newest fact, today's date, a second try) did not help (step 10).</div></div><table class=\"grid\"><tr><th>format</th><th>what it adds</th><th>Gemma 4 26B q4</th><th>Opus 5.5</th><th></th></tr><tr><td>text</td><td>a plain answer</td><td>0.681</td><td>0.698</td><td></td></tr><tr><td>text + known line</td><td>“reply exactly: I don't know” when the excerpts do not answer</td><td>0.708</td><td>0.749</td><td></td></tr><tr><td>JSON</td><td>{\"answer\": …, \"known\": …}</td><td>0.671</td><td><b>0.820</b></td><td>Opus’s best, the ceiling</td></tr><tr><td><b>JSON + known line</b></td><td>JSON and the known line</td><td><b>0.739</b></td><td>0.710</td><td><b>in use</b></td></tr><tr><td>JSON, reasoning first</td><td>{\"analysis\": …} before the answer</td><td>0.601</td><td>0.745</td><td>Gemma gets worse</td></tr><tr><td>JSON + known line + pages</td><td>\"pages\": the excerpts it used</td><td>0.800 · 5.4 s</td><td>0.696</td><td>the demo, for its links (step 8)</td></tr></table>"}]}];
const open = new Set();
let fresh = null;
function draw(nodes, box, depth) {
  nodes.forEach((n, i) => {
    const sum = n.id.endsWith(".sum");  // a summary, not a step: no number, no arrow into it
    if (i) box.insertAdjacentHTML("beforeend", sum ? '<span class="gapline"></span>' : '<span class="arrow"></span>');
    const item = document.createElement("div"); item.className = "item";
    const b = document.createElement("button"); b.className = "step" + (open.has(n.id) ? " open" : "");
    b.dataset.depth = depth;
    if (sum) b.classList.add("summary");
    b.innerHTML = (sum ? "" : '<span class="num">' + n.id + "</span>") + n.name + (n.kids || n.card ? '<span class="plus">' + (open.has(n.id) ? "−" : "+") + "</span>" : "");
    if (n.kids || n.card) b.onclick = () => { if (open.has(n.id)) open.delete(n.id); else { open.add(n.id); fresh = n.id; } render(); };
    item.appendChild(b);
    if (n.card && open.has(n.id)) {
      item.classList.add("down");
      item.insertAdjacentHTML("beforeend", '<div class="card' + (fresh === n.id ? " new" : "") + '">' + n.card + "</div>");
    }
    if (n.kids && open.has(n.id)) {
      const c = document.createElement("div"); c.className = "col kids" + (fresh === n.id ? " new" : "");
      item.classList.add("down");
      item.appendChild(c); draw(n.kids, c, depth + 1);
    }
    box.appendChild(item);
  });
}
function align() {
  const by = {};
  document.querySelectorAll(".step").forEach(b => { b.style.minWidth = ""; (by[b.dataset.depth] ||= []).push(b); });
  Object.values(by).forEach(bs => { const w = Math.max(...bs.map(b => b.offsetWidth)); bs.forEach(b => b.style.minWidth = w + "px"); });
}
const HEAD = {h: "#818b98", r: "#bf8700", s: "#59636e"};
function arrows() {
  document.querySelectorAll(".dia").forEach(dia => {
    dia.querySelector(":scope > svg.arr")?.remove();
    const kids = [...dia.querySelectorAll(":scope > .at")];
    dia.style.height = Math.max(...kids.map(k => k.offsetTop + k.offsetHeight)) + "px";
    const base = dia.getBoundingClientRect();
    const box = id => { const r = document.getElementById(id).getBoundingClientRect();
      return {l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top}; };
    const paths = JSON.parse(dia.dataset.arrows).map(([a, b, cls]) => {
      const s = box(a), e = box(b);
      let d;
      if (e.l > s.r - 10) {
        const x1 = s.r, y1 = (s.t + s.b) / 2, x2 = e.l - 3, y2 = Math.min(Math.max(y1, e.t + 14), e.b - 14), c = Math.max(30, (x2 - x1) / 2);
        d = `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
      } else {
        const x1 = (s.l + s.r) / 2, y1 = s.b, x2 = (e.l + e.r) / 2, y2 = e.t - 3, c = Math.max(20, (y2 - y1) / 2);
        d = `M${x1},${y1} C${x1},${y1 + c} ${x2},${y2 - c} ${x2},${y2}`;
      }
      return `<path class="${cls}" d="${d}" marker-end="url(#ah-${cls})"/>`;
    }).join("");
    const marks = Object.entries(HEAD).map(([k, c]) => `<marker id="ah-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${c}"/></marker>`).join("");
    dia.insertAdjacentHTML("afterbegin", `<svg class="arr" width="${dia.scrollWidth}" height="${dia.scrollHeight}"><defs>${marks}</defs>${paths}</svg>`);
  });
}
function render() { const p = document.getElementById("pipe"); const kids = STEPS[0].kids; if (kids.length === 1) { p.innerHTML = `<div class="card">${kids[0].card}</div>`; } else { p.innerHTML = ""; draw(kids, p, 1); } align(); arrows(); fresh = null; }
addEventListener("resize", arrows);
addEventListener("animationend", arrows);
document.addEventListener("click", e => {  // a switch inside a card: show one pane, keep the open steps as they are
  const b = e.target.closest(".sw");
  if (!b) return;
  const box = b.closest(".switch");
  box.querySelectorAll(":scope > .swb > .sw").forEach(x => x.classList.toggle("on", x === b));
  box.querySelectorAll(":scope > .swp").forEach(p => p.hidden = p.dataset.i !== b.dataset.i);
});
render();
