 Each section gets its headings as a label: the page title into <code>h1</code>, the section heading into <code>h2</code>, next to url and the day from step 1. Step 4 puts them on top of the chunk, so a chunk still says which page and section it is from.</div><div class=\"ename\"><span class=\"where\">solution/indexing/split_into_chunks.py · split_by_headings() · HEADING, metadata h1 and h2</span></div><div class=\"lbl\">the page dupaco.com/privacy-policy, 28 Sep · ✂ = where it is cut</div><div class=\"blk\"><div class=\"bl cutmark\">✂ a new section</div><div class=\"bl\"><b># Your Privacy Rights</b></div><div class=\"bl\">All financial companies, including Dupaco Community Credit Union, need to share members’ personal in</div><div class=\"bl cutmark\">✂ a new section</div><div class=\"bl\"><b>## Managing Your Privacy</b></div><div class=\"bl\">Your privacy matters to us. So does your right to understand and control how your information is use</div><div class=\"bl gap\">... 2 more lines ...</div><div class=\"bl cutmark\">✂ a new section</div><div class=\"bl\"><b>## California Consumer Act</b></div><div class=\"bl\">The California Consumer Privacy Act (CCPA) disclosure (dupaco.com/disclosures/california-consumer-pr</div><div class=\"bl cutmark\">✂ a new section</div><div class=\"bl\"><b>## You May Also Want to Consider</b></div><div class=\"bl\">#### About Us</div><div class=\"bl gap\">... 8 more lines ...</div></div><div class=\"lbl\" style=\"margin-top:8px\">→ 4 sections</div><div class=\"elem\"><div class=\"lbl\">section · 364 chars</div><div class=\"blk\"><div class=\"bl\"># Your Privacy Rights</div><div class=\"bl\">All financial companies, including Dupaco Community Credit Union, need to share members’ personal in</div><div class=\"meta\">metadata: url, title, fetched_at, snapshot_id, taken_on, published</div><div class=\"meta\"><ins>+ h1: Your Privacy Rights</ins></div></div></div><div class=\"elem\"><div class=\"lbl\">section · 563 chars</div><div class=\"blk code>. In the markdown that label is its own heading line, right above the <code>##</code>. A plain cut at the <code>##</code> would leave the label at the end of the section above it, where it does not belong. So headings that close a section with no text after them are carried down to the next section. On 28 Sep this happens 145 times on 62 pages; the labels are mostly <code>#####</code> (135 times): <code>##### Rates</code> 11, <code>##### Details &amp; Eligibility</code> 5, <code>##### THE BENEFITS</code> 3 ...</div><div class=\"ename\"><span class=\"where\">solution/indexing/split_into_chunks.py · carry_headings(), has_text()</span></div><div class=\"lbl\">the page, 28 Sep · green = headings carried down into the next section</div><div class=\"blk\"><div class=\"bl\">Insurance (dupaco.com/personal/insurance)</div><div class=\"bl\">Invest (dupaco.com/financial-services)</div><div class=\"bl cutmark\">✂ the new section starts here, not at the ## line</div><div class=\"bl moved\">##### MEMBER PERKS</div><div class=\"bl\">## All the Extras You Deserve</div></div><div class=\"from\">from dupaco.com/personal</div></div><div class=\"cpart\"><div class=\"cname\">the running example: dupaco.com/rates<span class=\"nums\"></span></div><div class=\"what\"><code>/rates</code> has one <code># Rates</code> and no <code>##</code> at all: the whole page is one section of 34,880 chars. Far over 4,000, so it goes on to 3.2.</div></div></div><div class=\"sec\"><div class=\"sect\">3 · Result</div><div class=\"secb\"><div class=\"brow\"><span class=\"bday\">12 May</span><span class=\"bar\"><span class=\"seg\" style=\"width:440.5px;background:#afb8c1\"></span><span class=\"seg\" style=\"width:22.8px;background:#eb6834\"></span></span><span class=\"bnum\"><b>1,871</b> sections · 92 longer than 4,000</span></div><div class=\"brow\"><span class=\"bday\">19 May</span><span class=\"bar\"><span class=\"seg\" style=\"width:437.5px;background:#afb8c1\"></span><span class=\"seg\" style=\"widt s · 40 tiny ones joined</span></div><div class=\"sm\" style=\"margin-top:6px\">A join can make a chunk a little longer than 4,000: on 28 Sep 3 chunks, the longest 4,029 chars.</div></div></div>"}, {"id": "3.sum", "name": "summary: step 3 overall", "card": "<div class=\"sec\"><div class=\"sect\">1 · Step by step, 28 Sep</div><div class=\"secb\"><div class=\"brow\"><span class=\"wname\">pages after step 2</span><span class=\"bnum\"><b>552</b></span></div><div class=\"brow\"><span class=\"wname\">3.1 sections</span><span class=\"bnum\"><b>2,057</b></span></div><div class=\"brow\"><span class=\"wname\">of them longer than 4,000</span><span class=\"bnum\"><b>99</b></span></div><div class=\"brow\"><span class=\"wname\">3.2 units from them</span><span class=\"bnum\"><b>529</b></span></div><div class=\"brow\"><span class=\"wname\">of them still longer</span><span class=\"bnum\"><b>49</b></span></div><div class=\"brow\"><span class=\"wname\">3.3 pieces from them</span><span class=\"bnum\"><b>105</b></span></div><div class=\"brow\"><span class=\"wname\">chunks before 3.4</span><span class=\"bnum\"><b>2,543</b></span></div><div class=\"brow\"><span class=\"wname\">3.4 chunks after joining tiny ones</span><span class=\"bnum\"><b>2,503</b></span></div></div></div><div class=\"sec\"><div class=\"sect\">2 · Chunk sizes, 28 Sep</div><div class=\"secb\"><div class=\"brow\"><span class=\"wname\">up to 500 chars</span><span class=\"bar\"><span class=\"seg\" style=\"width:327.9px;background:#2a78d6;border-radius:4px\"></span></span><span class=\"bnum\">733 chunks</span></div><div class=\"brow\"><span class=\"wname\">500–1,000 chars</span><span class=\"bar\"><span class=\"seg\" style=\"width:420.0px;background:#2a78d6;border-radius:4px\"></span></span><span class=\"bnum\">939 chunks</span></div><div class=\"brow\"><span class=\"wname\">1,000–2,000 chars</span><span class=\"bar\"><span class=\"seg\" style=\"width:241.1px;background:#2a78d6;border-radius:4px\"></span></span><span class=\" const open = new Set(["3"]);
let fresh = null;
function draw(nodes, box, depth) {
  nodes.forEach((n, i) => {
    const sum = n.id.endsWith(".sum");  // a summary, not a step: no number, no arrow into it
    if (i) box.insertAdjacentHTML("beforeend", sum ? '<span class="gapline"></span>' : '<span class="arrow"></span>');
    const item = document.createElement("div"); item.className = "item";
    const b = document.createElement("button"); b.className = "step" + (open.has(n.id) ? " open" : "");
    b.dataset.depth = depth;
    if (sum) b.classList.add("summary");
    b.innerHTML = (sum ? "" : '<span class="num">' + n.id + "</span>") + n.name + (n.kids || n.card ? '<span class="plus">' + (open.has(n.id) ? "−" : "+") + "</span>" : "");
    if (n.kids || n.card) b.onclick = () => { if (open.has(n.id)) open.delete(n.id); else { open.add(n.id); fresh = n.id; } render(); };
    item.appendChild(b);
    if (n.card && open.has(n.id)) {
      item.classList.add("down");
      item.insertAdjacentHTML("beforeend", '<div class="card' + (fresh === n.id ? " new" : "") + '">' + n.card + "</div>");
    }
    if (n.kids && open.has(n.id)) {
      const c = document.createElement("div"); c.className = "col kids" + (fresh === n.id ? " new" : "");
      item.classList.add("down");
      item.appendChild(c); draw(n.kids, c, depth + 1);
    }
    box.appendChild(item);
  });
}
function align() {
  const by = {};
  document.querySelectorAll(".step").forEach(b => { b.style.minWidth = ""; (by[b.dataset.depth] ||= []).push(b); });
  Object.values(by).forEach(bs => { const w = Math.max(...bs.map(b => b.offsetWidth)); bs.forEach(b => b.style.minWidth = w + "px"); });
}
const HEAD = {h: "#818b98", r: "#bf8700", s: "#59636e"};
function arrows() {
  document.querySelectorAll(".dia").forEach(dia => {
    dia.querySelector(":scope > svg.arr")?.remove();
    const kids = [...dia.querySelectorAll(":scope > .at")];
    dia.style.height = Math.max(...kids.map(k => k.offsetTop + k.offsetHeight)) + "px";
    const base = dia.getBoundingClientRect();
    const box = id => { const r = document.getElementById(id).getBoundingClientRect();
      return {l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top}; };
    const paths = JSON.parse(dia.dataset.arrows).map(([a, b, cls]) => {
      const s = box(a), e = box(b);
      let d;
      if (e.l > s.r - 10) {
        const x1 = s.r, y1 = (s.t + s.b) / 2, x2 = e.l - 3, y2 = Math.min(Math.max(y1, e.t + 14), e.b - 14), c = Math.max(30, (x2 - x1) / 2);
        d = `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
      } else {
        const x1 = (s.l + s.r) / 2, y1 = s.b, x2 = (e.l + e.r) / 2, y2 = e.t - 3, c = Math.max(20, (y2 - y1) / 2);
        d = `M${x1},${y1} C${x1},${y1 + c} ${x2},${y2 - c} ${x2},${y2}`;
      }
      return `<path class="${cls}" d="${d}" marker-end="url(#ah-${cls})"/>`;
    }).join("");
    const marks = Object.entries(HEAD).map(([k, c]) => `<marker id="ah-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${c}"/></marker>`).join("");
    dia.insertAdjacentHTML("afterbegin", `<svg class="arr" width="${dia.scrollWidth}" height="${dia.scrollHeight}"><defs>${marks}</defs>${paths}</svg>`);
  });
}
