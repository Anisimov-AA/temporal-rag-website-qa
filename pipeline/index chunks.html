><div class=\"lbl\">the text the searches read</div><div class=\"blk\"><div class=\"bl\"><ins>Privacy Policy | Dupaco</ins><span class=\"src\">← title</span></div><div class=\"bl\"><ins>Your Privacy Rights › Managing Your Privacy</ins><span class=\"src\">← h1 › h2</span></div><div class=\"bl \">## Managing Your Privacy</div><div class=\"bl \">Your privacy matters to us. So does your right to understand and control how your information is use</div><div class=\"bl \">View our Privacy Notice (dupaco.com/hubfs/DupacoCU_Privacy_Policy_2025.pdf)</div><div class=\"bl \">View our Privacy Policy (dupaco.com/digital-privacy-policy)</div><div class=\"meta\">metadata: url, fetched_at, snapshot_id, taken_on, published, and:</div><div class=\"meta\">title: Privacy Policy | Dupaco</div><div class=\"meta\">h1: Your Privacy Rights</div><div class=\"meta\">h2: Managing Your Privacy</div></div></div></div><div class=\"from\">from dupaco.com/privacy-policy, 28 Sep</div></div></div></div>"}, {"id": "4.2", "name": "give each chunk an id", "card": "<div class=\"cpart\"><div class=\"what\">Turning 2,500 chunks into vectors takes minutes, so an unchanged download should reuse last run's index. Each chunk gets an id from its own text and metadata: <code>sha1(text + metadata)-1</code>. The same text twice in one download gets <code>-2</code>. The download's name ends with a sha1 of all its ids, so any change in cleaning or chunking gives a new name and a new index.</div><div class=\"ename\"><span class=\"where\">solution/indexing/index_chunks.py · doc_ids(), fingerprint()</span></div></div><div class=\"c3ex\"><div class=\"lbl\" style=\"margin-top:10px\">one chunk</div><div class=\"ba\"><div><div class=\"lbl\">chunk</div><div class=\"blk\"><div class=\"bl\">Auto &amp; Motorcycle Loans</div><div class=\"bl\">| 2024-27 Model Year | 60 Months | 5.39% APR1 |</div><div class=\"bl gap\">…</div><div class=\"meta\">metadata: url /rates · taken_on 2026-09-28 · h1 Rates</div></div></div><div><div class=\"lbl\">its id</div><div class=\"blk\"><div class=\"bl\"><ins>b7a9f208453b9e5211e9f4b383953e33d5b78d1d-1</ins></div></div></div></div></div><div class=\"c3ex\"><div class=\"lbl\" style=\"margin-top:10px\">one download</div><div class=\"ba\"><div><div class=\"lbl\">download</div><div class=\"blk\"><div class=\"bl\">28 Sep · 2,503 ids</div></div></div><div><div class=\"lbl\">its collection name</div><div class=\"blk\"><div class=\"bl\"><ins>05_2026-09-28_latest__bge-m3__3ddb2e16</ins></div><div class=\"meta\">27 Aug and 28 Sep share 2,093 texts but 0 ids: the day is in the metadata</div></div></div></div></div>"}, {"id": "4.3", "name": "build the meaning index", "card": "<div class=\"cpart\"><div class=\"what\">A question and a page often say the same thing in different words: “car loan rate” and “Auto &amp; Motorcycle Loans … APR”. To match them by meaning, every text becomes a <b>vector</b> of 1,024 numbers made by bge-m3, and a close meaning gives close vectors: <code>closeness = cos(a, b)</code>, 1 = the same. bge-m3 reads up to 8k tokens, so a 4,000-char chunk (about 1,000 tokens) fits whole.</div><div class=\"ename\"><span class=\"where\">solution/indexing/index_chunks.py · EMBEDDINGS · bge-m3, num_ctx=8192</span></div></div><div class=\"c3ex\"><div class=\"lbl\" style=\"margin-top:10px\">one chunk</div><div class=\"ba\"><div><div class=\"lbl\">text</div><div class=\"blk\"><div class=\"bl\">Deposit and Loan Rates: Earn More, Pay Less | Dupaco</div><div class=\"bl\">Rates</div><div class=\"bl\">Auto &amp; Motorcycle Loans</div><div class=\"bl\">| 2024-27 Model Year | 60 Months | 5.39% APR1 |</div><div class=\"bl gap\">…</div></div></div><div><div class=\"lbl\">vector: 1,024 numbers</div><div class=\"blk\"><div class=\"bl\"><ins>[-0.0288, -0.0303, -0.0144, -0.0074, -0.0406, -0.0205, … 1,018 more]</ins></div></div></div></div></div><div class=\"c3ex\"><div class=\"lbl\" style=\"margin-top:10px\">the 5.39% chunk against all 2,503</div><div class=\"ba\"><div><div class=\"lbl\">chunk</div><div class=\"blk\"><div class=\"bl\">the 5.39% chunk</div><div class=\"meta\">compared with every chunk of 28 Sep</div></div></div><div><div class=\"lbl\">nearest … farthest</div><div class=\"blk\"><div class=\"bl\"><ins>0.95  Rates — /personal/loans/auto-loans/</ins></div><div class=\"bl\"><ins>0.95  Rates — /personal/loans/auto-motorcycle-loans</ins></div><div class=\"bl\"><ins>0.94  Auto Loan Rates — /switch-and-earn</ins></div><div class=\"bl gap\">…</div><div class=\"bl\">0.29  Free Website Design Bootcamp</div><div class=\"bl\">0.28  Hashtag help — 7 tips to discover your dream job</div></div></div></div></div><div class=\"cpart\"><div class=\"what\">Why bge-m3: 4 models were tried on 27 questions. In the full search, with the reranker after them, all 4 find the answer in the top 3 every time, so the model mostly decides the index time. The times below were measured before Gemma was unloaded for the build (next paragraph); now bge-m3 takes 5 min.</div></div><table class=\"grid\"><tr><th>model</th><th>vector</th><th>vectors alone · top 3</th><th>with BM25 + reranker · top 3</th><th>index time</th><th></th></tr><tr><td><b>bge-m3</b></td><td>1,024</td><td>19/27</td><td>27/27</td><td>27 min</td><td><b>in use</b></td></tr><tr><td>embeddinggemma</td><td>768</td><td>22/27</td><td>27/27</td><td>21–35 min</td><td>over the limit once</td></tr><tr><td>qwen3-embedding 0.6B</td><td>1,024</td><td>20/27</td><td>27/27</td><td>~24 min</td><td>no gain</td></tr><tr><td>qwen3-embedding 4B</td><td>2,560</td><td>21/27</td><td>27/27</td><td>72 min</td><td>too slow</td></tr></table><div class=\"cpart\"><div class=\"what\">Chroma keeps the vectors on disk in <code>index/</code>, one collection per download, 64 chunks at a time. If the collection already holds exactly these ids, it is reused and nothing is computed. If not, Gemma is unloaded from the GPU first, so bge-m3 runs on the GPU.</div><div class=\"what\">All 5 downloads from scratch: 5.3 min.</div><div class=\"ename\"><span class=\"where\">solution/indexing/index_chunks.py · build_index(), index_is_ready() · solution.py · free_the_gpu()</span></div></div>"}, {"id": "4.4", "name": "build the word index", "card": "<div class=\"cpart\"><div class=\"what\">A vector catches the meaning but can miss an exact token: 5.39, a product name, a code. BM25 scores a chunk by the question's words, and a rare word counts more: <code>idf(w) = ln((N − n + 0.5) / (n + 0.5))</code>, N = chunks in the download, n = chunks with the word. Words are lower case, a number keeps its point (5.39% → 5.39). The index lives in memory and is built at every start.</div><div class=\"what\">28 Sep: 2,503 word lists, 12,350 different words, 185 words per chunk.</div><div class=\"ename\"><span class=\"where\">solution/indexing/index_chunks.py · words(), Keywords · rank_bm25.BM25Okapi</span></div></div><div class=\"c3ex\"><div class=\"lbl\" style=\"margin-top:10px\">one chunk</div><div class=\"ba\"><div><div class=\"lbl\">text</div><div class=\"blk\"><div class=\"bl\">Deposit and Loan Rates: Earn More, Pay Less | Dupaco</div><div class=\"bl\">Rates</div><div class=\"bl\">Auto &amp; Motorcycle Loans</div><div class=\"bl\">| 2024-27 Model Year | 60 Months | 5.39% APR1 |</div><div class=\"bl gap\">…</div></div></div><div><div class=\"lbl\">words and how often</div><div class=\"blk\"><div class=\"bl\"><ins>loan 12 · model 10 · months 10 · rates 10 · year 10 · apr1 9 · loans 7 · auto 6 · and 5 · 5.39 2 · …</ins></div><div class=\"meta\">length 243 words</div></div></div></div></div><div class=\"c3ex\"><div class=\"lbl\" style=\"margin-top:10px\">word weights</div><div class=\"ba\"><div><div class=\"lbl\">word · chunks with it</div><div class=\"blk\"><div class=\"bl\">5.39    in 3 chunks</div><div class=\"bl\">apr1    in 6</div><div class=\"bl\">motorcycle in 33</div><div class=\"bl\">loan    in 565</div><div class=\"bl\">dupaco  in 2,419</div></div></div><div><div class=\"lbl\">weight</div><div class=\"blk\"><div class=\"bl\"><ins>6.57</ins></div><div class=\"bl\"><ins>5.95</ins></div><div class=\"bl\"><ins>4.30</ins></div><div class=\"bl\"><ins>1.23</ins></div><div class=\"bl\"><ins>−3.35 → below 0 → the floor 1.56</ins></div></div></div></div></div>"}, {"id": "4.sum", "name": "summary: step 4 overall", "card": "<div class=\"cpart\"><div class=\"what\">Every download gets two indexes over the same texts and ids: Chroma by meaning, on disk, and BM25 by words, in memory. Step 5 searches both and merges the results.</div><div class=\"ename\"><span class=\"where\">solution.py · ingest()</span></div></div><table class=\"grid\"><tr><th>download</th><th>chunks</th><th>Chroma collection</th><th>BM25</th></tr><tr><td>12 May</td><td>2,424</td><td><code>…__bge-m3__8840c6bd</code></td><td>2,424 word lists</td></tr><tr><td>19 May</td><td>2,420</td><td><code>…__bge-m3__9fb3d77c</code></td><td>2,420 word lists</td></tr><tr><td>9 Jun</td><td>2,402</td><td><code>…__bge-m3__a6c17a84</code></td><td>2,402 word lists</td></tr><tr><td>27 Aug</td><td>2,389</td><td><code>…__bge-m3__c8ec62cc</code></td><td>2,389 word lists</td></tr><tr><td>28 Sep</td><td>2,503</td><td><code>…__bge-m3__3ddb2e16</code></td><td>2,503 word lists</td></tr></table>"}]}];
const open = new Set(["4"]);

function draw(nodes, box, depth) {
  nodes.forEach((n, i) => {
    const sum = n.id.endsWith(".sum");  // a summary, not a step: no number, no arrow into it
    if (i) box.insertAdjacentHTML("beforeend", sum ? '<span class="gapline"></span>' : '<span class="arrow"></span>');
    const item = document.createElement("div"); item.className = "item";
    const b = document.createElement("button"); b.className = "step" + (open.has(n.id) ? " open" : "");
    b.dataset.depth = depth;
    if (sum) b.classList.add("summary");
    b.innerHTML = (sum ? "" : '<span class="num">' + n.id + "</span>") + n.name + (n.kids || n.card ? '<span class="plus">' + (open.has(n.id) ? "−" : "+") + "</span>" : "");
    if (n.kids || n.card) b.onclick = () => { if (open.has(n.id)) open.delete(n.id); else { open.add(n.id); fresh = n.id; } render(); };
    item.appendChild(b);
    if (n.card && open.has(n.id)) {
      item.classList.add("down");
      item.insertAdjacentHTML("beforeend", '<div class="card' + (fresh === n.id ? " new" : "") + '">' + n.card + "</div>");
    }
    if (n.kids && open.has(n.id)) {
      const c = document.createElement("div"); c.className = "col kids" + (fresh === n.id ? " new" : "");
      item.classList.add("down");
      item.appendChild(c); draw(n.kids, c, depth + 1);
    }
    box.appendChild(item);
  });
}

}
const HEAD = {h: "#818b98", r: "#bf8700", s: "#59636e"};
function arrows() {
  document.querySelectorAll(".dia").forEach(dia => {
    dia.querySelector(":scope > svg.arr")?.remove();
    const kids = [...dia.querySelectorAll(":scope > .at")];
    dia.style.height = Math.max(...kids.map(k => k.offsetTop + k.offsetHeight)) + "px";
    const base = dia.getBoundingClientRect();
    const box = id => { const r = document.getElementById(id).getBoundingClientRect();
      return {l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top}; };
    const paths = JSON.parse(dia.dataset.arrows).map(([a, b, cls]) => {
      const s = box(a), e = box(b);

      if (e.l > s.r - 10) {
        const x1 = s.r, y1 = (s.t + s.b) / 2, x2 = e.l - 3, y2 = Math.min(Math.max(y1, e.t + 14), e.b - 14), c = Math.max(30, (x2 - x1) / 2);
        d = `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
      } else {
        const x1 = (s.l + s.r) / 2, y1 = s.b, x2 = (e.l + e.r) / 2, y2 = e.t - 3, c = Math.max(20, (y2 - y1) / 2);
        d = `M${x1},${y1} C${x1},${y1 + c} ${x2},${y2 - c} ${x2},${y2}`;
